# A100 80GB - Full Utilization (60-70GB target)
# Now that gradient checkpointing works, we can be more aggressive

hydra:
  job:
    chdir: false
    env_set:
      WANDB_ENTITY: "xplstm" 
      WANDB_PROJECT: "CSE6250_MNet_Reproduction" 
      WANDB_GROUP: "mnet_arch_a100_full"

trainer:
  model: 3d_fullres
  trainer_name: myTrainer_reproduction_WandB_2
  task: Task024_Promise
  fold: 0
  plans_identifier: nnUNetData_plans_v2.1_trgSp_z2p2_yx0p6125
  save_npz: true
  validation_only: false
  valbest: false

  # paths
  dataset_directory: /teamspace/studios/this_studio/nnUNet_preprocessed
  results_base: /teamspace/studios/this_studio/nnUNet_results

  # A100 FULL UTILIZATION
  fp16: true
  deterministic: false
  unpack_data: true
  max_epochs: 50
  
  # INCREASE batch size to utilize more GPU
  batch_size: 4              # Up from 2
  
  # Keep gradient checkpointing (it's working!)
  use_checkpoint: true
  
  # Aggressive data loading
  num_threads: 32
  num_cached_per_thread: 4
  pin_memory: true
  
  # Architecture settings
  gated_fusion: spatial
  width_mult: 1.0 
  use_sep3d: false
  cat_reduce: false

  # More VMamba stages - we have the memory!
  vmamba:
    enabled: true
    backend_available: true
    
    # Add more stages
    down_stages: [2, 3]        # 2 stages (was 1)
    up_stages: [1, 2, 3]       # 3 stages (was 1)  
    bottleneck_stages: [4, 5]  # Keep 2
    
    # Full capacity
    hidden_ratio: 1.0          # Up from 0.75
    d_state: 16                # Full state
    dropout: 0.1
    
    # Architecture details
    fuse_mode: concat
    use_se: true
    se_reduction: 8

  # wandb controls
  wandb:
    enabled: true
    project: CSE6250_MNet_Reproduction
    run_name: mnet_task24_fold0_a100_full
    group: mnet_arch_a100_full

