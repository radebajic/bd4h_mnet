# Quick preset for testing + Optuna sweep
defaults:
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: grid
  - _self_

hydra:
  job:
    chdir: false
    env_set:
      WANDB_ENTITY: "xplstm" 
      WANDB_PROJECT: "CSE6250_MNet_Reproduction" 
  sweeper:
    study_name: mnet_arch_search_4
    n_trials: 6
    params:
      #trainer.vmamba.down_stages: choice([2], [3], [2,3], [3,4])
      #trainer.vmamba.up_stages: choice([2], [3], [2,3], [1,2])
      trainer.vmamba.bottleneck_stages: choice([3], [4], [5], [3,4], [4,5], [3,4,5])
      #trainer.vmamba.axial_reduce: choice(0.25, 0.5, 0.75, 1.0)
      #trainer.gated_fusion: choice("none", "spatial")
      #trainer.width_mult: choice(0.75, 1.0, 1.25)
      #trainer.use_sep3d: choice(false, true)
      #trainer.cat_reduce: choice(false, true)

trainer:
  model: 3d_fullres
  trainer_name: myTrainer_reproduction_WandB_2
  task: Task024_Promise
  fold: 0
  plans_identifier: nnUNetData_plans_v2.1_trgSp_z2p2_yx0p6125
  save_npz: false

  dataset_directory: /teamspace/studios/this_studio/nnUNet_preprocessed
  results_base: /teamspace/studios/this_studio/nnUNet_results

  fp16: true
  deterministic: false
  unpack_data: true
  max_epochs: 6
  #gated_fusion: spatial
  width_mult: 1.0
  use_sep3d: false
  use_checkpoint: false
  cat_reduce: false

  vmamba:
    down_stages: []
    up_stages: []
    bottleneck_stages: []
    axial_reduce: 0.5

  wandb:
    enabled: true
    project: CSE6250_MNet_Reproduction
    run_name: mnet_task24_fold0_8e_2
    group: mnet_arch_search_expanded_8e_bottleneck
    