# Full 3D VMamba training - identical to best_arch_3.yaml except for Full3D VMamba
# Uses MNetFull3D which flattens D×H×W to sequence (vs Z-axis only)
# All other settings kept identical to best_arch_3.yaml

hydra:
  job:
    chdir: false
    env_set:
      WANDB_ENTITY: "xplstm" 
      WANDB_PROJECT: "CSE6250_MNet_Reproduction" 
      WANDB_GROUP: "mnet_full3d_best_arch_3_5epochs"

trainer:
  model: 3d_fullres
  trainer_name: myTrainer_reproduction_WandB_Full3D  # ONLY CHANGE: Use Full3D trainer
  task: Task024_Promise
  fold: 0
  plans_identifier: nnUNetData_plans_v2.1_trgSp_z2p2_yx0p6125
  save_npz: true
  validation_only: false
  valbest: false

  # paths (identical)
  dataset_directory: /teamspace/studios/this_studio/nnUNet_preprocessed
  results_base: /teamspace/studios/this_studio/nnUNet_results

  # training knobs (identical)
  fp16: true
  deterministic: false
  unpack_data: true
  max_epochs: 5
  gated_fusion: null
  width_mult: 1.0 
  use_sep3d: false
  use_checkpoint: true
  cat_reduce: false

  # VMamba - same stage selection, ADD Full3D-specific parameters
  vmamba:
    # Stage selection (identical to best_arch_3.yaml)
    down_stages: []
    up_stages: []
    bottleneck_stages: [5]
    
    # NEW: Full3D VMamba-specific parameters (optimized for memory)
    hidden_ratio: 0.5      # Reduced from 0.5 for memory savings
    d_state: 8               # SSM state dimension
    dropout: 0.0             # Dropout rate
    use_se: true            # Disabled to save memory
    se_reduction: 8          # SE reduction ratio

  # wandb controls (updated names for Full3D tracking)
  wandb:
    enabled: true
    project: CSE6250_MNet_Reproduction
    run_name: mnet_task24_fold0_bestArch3_full3d_5epochs
    group: mnet_full3d_best_arch_3_5epochs


