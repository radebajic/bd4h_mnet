# Quick preset for testing + Optuna sweep
# Fixed for myTrainer_reproduction_WandB_2 with tri-plane VMamba
defaults:
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: grid
  - _self_

hydra:
  job:
    chdir: false
    env_set:
      WANDB_ENTITY: "xplstm" 
      WANDB_PROJECT: "CSE6250_MNet_Reproduction" 
  sweeper:
    study_name: mnet_arch_search_triplane
    n_trials: 6
    params:
      trainer.vmamba.bottleneck_stages: choice([3], [4], [5], [3,4], [4,5], [3,4,5])
      #trainer.vmamba.down_stages: choice([2], [3], [2,3], [3,4])
      #trainer.vmamba.up_stages: choice([2], [3], [2,3], [1,2])
      # Optionally sweep VMamba hyperparams:
      # trainer.vmamba.hidden_ratio: choice(0.25, 0.5, 0.75)
      # trainer.vmamba.dropout: choice(0.0, 0.1)


trainer:
  model: 3d_fullres
  trainer_name: myTrainer_reproduction_WandB_2
  task: Task024_Promise
  fold: 0
  plans_identifier: nnUNetData_plans_v2.1_trgSp_z2p2_yx0p6125
  save_npz: false

  dataset_directory: /teamspace/studios/this_studio/nnUNet_preprocessed
  results_base: /teamspace/studios/this_studio/nnUNet_results

  fp16: true
  deterministic: false
  unpack_data: true
  max_epochs: 6

  # VMamba tri-plane configuration
  vmamba:
    down_stages: []
    up_stages: []
    bottleneck_stages: []
    hidden_ratio: 0.5      # Controls capacity of selective scan (was axial_reduce)
    dropout: 0.0           # Dropout in VMamba blocks
    fuse_mode: concat      # How to fuse tri-plane features: 'sum' or 'concat'
    use_se: true          # Use squeeze-excitation attention
    se_reduction: 8       # SE reduction ratio

  wandb:
    enabled: true
    project: CSE6250_MNet_Reproduction
    run_name: mnet_task24_fold0_triplane_sweep
    group: mnet_arch_triplane_bottleneck

