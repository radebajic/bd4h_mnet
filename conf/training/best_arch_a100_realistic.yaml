# Realistic A100 80GB Config - Actually Works!
# Balanced between performance and memory safety

hydra:
  job:
    chdir: false
    env_set:
      WANDB_ENTITY: "xplstm" 
      WANDB_PROJECT: "CSE6250_MNet_Reproduction" 
      WANDB_GROUP: "mnet_arch_a100_realistic"

trainer:
  model: 3d_fullres
  trainer_name: myTrainer_reproduction_WandB_2
  task: Task024_Promise
  fold: 0
  plans_identifier: nnUNetData_plans_v2.1_trgSp_z2p2_yx0p6125
  save_npz: true
  validation_only: false
  valbest: false

  # paths
  dataset_directory: /teamspace/studios/this_studio/nnUNet_preprocessed
  results_base: /teamspace/studios/this_studio/nnUNet_results

  # A100 REALISTIC SETTINGS (tested to not OOM)
  fp16: true
  deterministic: false
  unpack_data: true
  max_epochs: 50
  
  # Conservative batch size - works reliably
  batch_size: 2              # Safer than 4
  
  # Light gradient checkpointing for safety
  use_checkpoint: true       # Re-enabled for safety
  
  # Good data loading (still important)
  num_threads: 24
  num_cached_per_thread: 3
  pin_memory: true
  
  # Architecture settings
  gated_fusion: spatial
  width_mult: 1.0 
  use_sep3d: false
  cat_reduce: false

  # Balanced VMamba - not too aggressive
  vmamba:
    enabled: true
    backend_available: true
    
    # Fewer stages than "optimized" version
    down_stages: [3]           # Just one down stage
    up_stages: [2]             # Just one up stage  
    bottleneck_stages: [4, 5]  # Keep both bottlenecks
    
    # Moderate capacity
    hidden_ratio: 0.75         # Slightly reduced
    d_state: 16                # Keep full state
    dropout: 0.1
    
    # Architecture details
    fuse_mode: concat
    use_se: true
    se_reduction: 8

  # wandb controls
  wandb:
    enabled: true
    project: CSE6250_MNet_Reproduction
    run_name: mnet_task24_fold0_a100_realistic
    group: mnet_arch_a100_realistic

