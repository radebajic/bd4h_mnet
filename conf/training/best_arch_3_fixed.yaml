# Best architecture training on 50 epochs
# Fixed for myTrainer_reproduction_WandB_2 with tri-plane VMamba
# Original: https://wandb.ai/xplstm/CSE6250_MNet_Reproduction/runs/o756id77/overview

hydra:
  job:
    chdir: false
    env_set:
      WANDB_ENTITY: "xplstm" 
      WANDB_PROJECT: "CSE6250_MNet_Reproduction" 
      WANDB_GROUP: "mnet_arch_best_triplane_50epochs"

trainer:
  model: 3d_fullres
  trainer_name: myTrainer_reproduction_WandB_2
  task: Task024_Promise
  fold: 0
  plans_identifier: nnUNetData_plans_v2.1_trgSp_z2p2_yx0p6125
  save_npz: true
  validation_only: false
  valbest: false

  # paths
  dataset_directory: /teamspace/studios/this_studio/nnUNet_preprocessed
  results_base: /teamspace/studios/this_studio/nnUNet_results

  # training knobs
  fp16: true
  deterministic: false
  unpack_data: true
  max_epochs: 50

  # VMamba tri-plane configuration (best from sweep)
  vmamba:
    down_stages: [3]
    up_stages: [2]
    bottleneck_stages: [4,5]
    hidden_ratio: 0.5      # Controls capacity of selective scan
    dropout: 0.0           # No dropout
    fuse_mode: concat      # Concatenate tri-plane features
    use_se: true          # Use squeeze-excitation
    se_reduction: 8       # SE reduction ratio

  # wandb controls
  wandb:
    enabled: true
    project: CSE6250_MNet_Reproduction
    run_name: mnet_task24_fold0_triplane_bestArch
    group: mnet_arch_best_triplane_50epochs

