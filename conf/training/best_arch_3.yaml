# best architecture training on 50 epochs
# https://wandb.ai/xplstm/CSE6250_MNet_Reproduction/runs/o756id77/overview

hydra:
  job:
    chdir: false
    env_set:
      WANDB_ENTITY: "xplstm" 
      WANDB_PROJECT: "CSE6250_MNet_Reproduction" 
      WANDB_GROUP: "mnet_arch_best_3_arch_150epochs"

trainer:
  model: 3d_fullres
  trainer_name: myTrainer_reproduction_WandB
  task: Task024_Promise
  fold: 0
  plans_identifier: nnUNetData_plans_v2.1_trgSp_z2p2_yx0p6125
  save_npz: true
  validation_only: false
  valbest: false

  # paths
  dataset_directory: /teamspace/studios/this_studio/nnUNet_preprocessed
  results_base: /teamspace/studios/this_studio/nnUNet_results

  # training knobs
  fp16: true
  deterministic: false
  unpack_data: true
  max_epochs: 150
  gated_fusion: null
  width_mult: 1.0 
  use_sep3d: false
  use_checkpoint: false
  cat_reduce: false

  # VMamba 
  vmamba:
    down_stages: [3]
    up_stages: [2]
    bottleneck_stages: [4,5]
    axial_reduce: 0.5

  # wandb controls
  wandb:
    enabled: true
    project: CSE6250_MNet_Reproduction
    run_name: mnet_task24_fold0_bestArch3_150epochs
    group: mnet_arch_best_arch_3_150epochs
    